[tools]
bun = "1.4"
node = "24"
dotnet = "10"
java = "temurin-25"
maven = "3.10.0"
aspire = "13"
uv = "latest"
azure-cli = { version = "2", depends = ["uv"] }
github-cli = "2"

[settings]
task.run_auto_install = false
idiomatic_version_file_enable_tools = ['bun', 'dotnet']

[tasks.restore]
description = "Restore NuGet packages and tools"
run = ["dotnet restore", "dotnet tool restore"]

[tasks.build]
description = "Build the solution"
depends = ["restore"]
run = "dotnet build BookWorm.slnx"

[tasks.test]
description = "Run tests"
depends = ["build"]
run = ["mise run test:unit", "mise run test:contracts"]

[tasks."test:unit"]
description = "Run unit and architecture tests"
run = [
  "dotnet test src/Services/Basket/BookWorm.Basket.UnitTests/BookWorm.Basket.UnitTests.csproj",
  "dotnet test src/Services/Catalog/BookWorm.Catalog.UnitTests/BookWorm.Catalog.UnitTests.csproj",
  "dotnet test src/Services/Chat/BookWorm.Chat.UnitTests/BookWorm.Chat.UnitTests.csproj",
  "dotnet test src/Services/Finance/BookWorm.Finance.UnitTests/BookWorm.Finance.UnitTests.csproj",
  "dotnet test src/Services/McpTools/BookWorm.McpTools.UnitTests/BookWorm.McpTools.UnitTests.csproj",
  "dotnet test src/Services/Notification/BookWorm.Notification.UnitTests/BookWorm.Notification.UnitTests.csproj",
  "dotnet test src/Services/Ordering/BookWorm.Ordering.UnitTests/BookWorm.Ordering.UnitTests.csproj",
  "dotnet test src/Services/Rating/BookWorm.Rating.UnitTests/BookWorm.Rating.UnitTests.csproj",
  "dotnet test src/Services/Scheduler/BookWorm.Scheduler.UnitTests/BookWorm.Scheduler.UnitTests.csproj",
  "dotnet test tests/BookWorm.ArchTests/BookWorm.ArchTests.csproj",
]

[tasks."test:contracts"]
description = "Generate consumer pacts and verify provider messages"
run = [
  "dotnet test src/Services/Basket/BookWorm.Basket.ContractTests/BookWorm.Basket.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Catalog/BookWorm.Catalog.ContractTests/BookWorm.Catalog.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Finance/BookWorm.Finance.ContractTests/BookWorm.Finance.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Notification/BookWorm.Notification.ContractTests/BookWorm.Notification.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Ordering/BookWorm.Ordering.ContractTests/BookWorm.Ordering.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Rating/BookWorm.Rating.ContractTests/BookWorm.Rating.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactConsumer]'",
  "dotnet test src/Services/Basket/BookWorm.Basket.ContractTests/BookWorm.Basket.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
  "dotnet test src/Services/Catalog/BookWorm.Catalog.ContractTests/BookWorm.Catalog.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
  "dotnet test src/Services/Finance/BookWorm.Finance.ContractTests/BookWorm.Finance.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
  "dotnet test src/Services/Ordering/BookWorm.Ordering.ContractTests/BookWorm.Ordering.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
  "dotnet test src/Services/Rating/BookWorm.Rating.ContractTests/BookWorm.Rating.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
  "dotnet test src/Services/Scheduler/BookWorm.Scheduler.ContractTests/BookWorm.Scheduler.ContractTests.csproj --treenode-filter '/*/*/*/*[Category=PactProvider]'",
]

[tasks."format:cs"]
description = "Format C# code"
run = "dnx csharpier format ."

[tasks."format:fe"]
description = "Format frontend code"
run = "bun run format"
dir = "src/Clients"

[tasks."format:eventcatalog"]
description = "Format EventCatalog"
run = "bun run format"
dir = "docs/eventcatalog"

[tasks."format:docusaurus"]
description = "Format Docusaurus"
run = "bun run format"
dir = "docs/docusaurus"

[tasks."format:k6"]
description = "Format K6 scripts"
run = "bun run format"
dir = "src/Aspire/BookWorm.AppHost/Container/k6"

[tasks."format:keycloakify"]
description = "Format Keycloakify"
run = "bun run format"
dir = "src/Aspire/BookWorm.AppHost/Container/keycloak/keycloakify"

[tasks.format]
description = "Format all code"
depends = [
  "format:cs",
  "format:fe",
  "format:eventcatalog",
  "format:docusaurus",
  "format:k6",
  "format:keycloakify",
]

[tasks.clean]
description = "Clean build artifacts"
run = "dotnet clean BookWorm.slnx"

[tasks.hook]
description = "Setup pre-commit hooks"
run = "git config core.hooksPath .husky"

[tasks.prepare]
description = "First-time setup after cloning (restore + git hooks)"
depends = ["restore", "hook"]

[tasks.run]
description = "Run the application with Aspire"
run = "aspire start"

[tasks."update:eventcatalog"]
description = "Update EventCatalog bun packages"
run = "bun update"
dir = "docs/eventcatalog"

[tasks."update:docusaurus"]
description = "Update Docusaurus bun packages"
run = "bun update"
dir = "docs/docusaurus"

[tasks."update:k6"]
description = "Update K6 bun packages"
run = "bun update"
dir = "src/Aspire/BookWorm.AppHost/Container/k6"

[tasks."update:keycloakify"]
description = "Update Keycloakify bun packages"
run = "bun update"
dir = "src/Aspire/BookWorm.AppHost/Container/keycloak/keycloakify"

[tasks."update:fe"]
description = "Update frontend bun packages"
run = "bun update --recursive"
dir = "src/Clients"

[tasks.update]
description = "Update all packages"
depends = [
  "update:eventcatalog",
  "update:docusaurus",
  "update:k6",
  "update:keycloakify",
  "update:fe",
]
