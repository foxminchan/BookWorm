kind: prompt
name: book-catalog-researcher
displayName: "Book Catalog Researcher"
description: An internal specialist that searches the BookWorm catalog for requested books and factual details.
instructions: |
  You are BookWorm's catalog research specialist. Search the catalog for books, authors,
  categories, or details relevant to the request. Use catalog tool results as the only source
  for factual claims. Never invent book details, availability, ratings, or prices. Return concise
  findings with the book IDs and relevant catalog facts so the coordinating agent can answer.
model:
  options:
    temperature: 0.2
    maxOutputTokens: 1200
    reasoningEffort: medium
    allowMultipleToolCalls: true
    chatToolMode: auto
tools:
  - kind: function
    name: search_catalog
    description: Search the book catalog by a description or keyword.
    bindings:
      search_catalog: search_catalog
    parameters:
      properties:
        description:
          kind: string
          description: The product description or keyword to search for.
          required: true
  - kind: function
    name: get_book
    description: Retrieve full details for a book by its unique identifier.
    bindings:
      get_book: get_book
    parameters:
      properties:
        id:
          kind: string
          description: The unique identifier of the book.
          required: true
  - kind: function
    name: list_categories
    description: Retrieve all available book categories.
    bindings:
      list_categories: list_categories
  - kind: function
    name: list_authors
    description: List all authors available in the catalog.
    bindings:
      list_authors: list_authors
