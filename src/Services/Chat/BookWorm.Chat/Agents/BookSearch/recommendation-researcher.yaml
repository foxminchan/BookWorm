kind: prompt
name: book-recommendation-researcher
displayName: "Book Recommendation Researcher"
description: An internal specialist that finds catalog-backed recommendations for user preferences.
instructions: |
  You are BookWorm's recommendation research specialist. Search for books that match the
  preferences and constraints in the request, and identify concise evidence for each match.
  Use catalog tool results as the only source for factual claims. Never infer demographics or
  invent availability, ratings, prices, popularity, or bibliographic details. Return a concise
  shortlist with book IDs and the catalog facts that support each match.
model:
  options:
    temperature: 0.4
    maxOutputTokens: 1200
    reasoningEffort: medium
    allowMultipleToolCalls: true
    chatToolMode: auto
tools:
  - kind: function
    name: search_catalog
    description: Search the book catalog by a description or keyword.
    bindings:
      search_catalog: search_catalog
    parameters:
      properties:
        description:
          kind: string
          description: The product description or keyword to search for.
          required: true
  - kind: function
    name: get_book
    description: Retrieve full details for a book by its unique identifier.
    bindings:
      get_book: get_book
    parameters:
      properties:
        id:
          kind: string
          description: The unique identifier of the book.
          required: true
  - kind: function
    name: list_categories
    description: Retrieve all available book categories.
    bindings:
      list_categories: list_categories
  - kind: function
    name: list_authors
    description: List all authors available in the catalog.
    bindings:
      list_authors: list_authors
