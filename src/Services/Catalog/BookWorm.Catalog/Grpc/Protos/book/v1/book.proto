edition = "2023";

option csharp_namespace = "BookWorm.Catalog.Grpc.Services";

package book.v1;

service BookGrpcService {
  rpc GetBook (GetBookRequest) returns (GetBookResponse);
  rpc GetBooks (GetBooksRequest) returns (GetBooksResponse);
  rpc GetDashboard (GetDashboardRequest) returns (GetDashboardResponse);
  rpc ListBooks (ListBooksRequest) returns (ListBooksResponse);
  rpc GetBookDetails (GetBookDetailsRequest) returns (GetBookDetailsResponse);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc ListAuthors (ListAuthorsRequest) returns (ListAuthorsResponse);
}

message GetDashboardRequest {}

message GetDashboardResponse {
  int64 total_books = 1;
  repeated DashboardCategory categories = 2;
}

message DashboardCategory {
  string name = 1;
  int64 value = 2;
}

message GetBookRequest {
  string book_id = 1;
}

message GetBookResponse {
  string id = 1;
  string name = 2;
  DecimalValue price = 3;
  DecimalValue price_sale = 4;
  BookStatus status = 5;
}

message GetBooksRequest {
  repeated string book_ids = 1;
}

message GetBooksResponse {
  repeated GetBookResponse books = 1;
}

enum BookStatus {
  BOOK_STATUS_UNSPECIFIED = 0;
  BOOK_STATUS_IN_STOCK = 1;
  BOOK_STATUS_OUT_OF_STOCK = 2;
}

message DecimalValue {
  int64 units = 1;
  sfixed32 nanos = 2;
}

message ListBooksRequest {
  string search = 1;
}

message ListBooksResponse {
  repeated BookItem books = 1;
}

message GetBookDetailsRequest {
  string book_id = 1;
}

message GetBookDetailsResponse {
  BookItem book = 1;
}

message BookItem {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  DecimalValue price = 5;
  DecimalValue price_sale = 6;
  BookStatus status = 7;
  CategoryItem category = 8;
  PublisherItem publisher = 9;
  repeated AuthorItem authors = 10;
  double average_rating = 11;
  int32 total_reviews = 12;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated CategoryItem categories = 1;
}

message CategoryItem {
  string id = 1;
  string name = 2;
}

message PublisherItem {
  string id = 1;
  string name = 2;
}

message ListAuthorsRequest {}

message ListAuthorsResponse {
  repeated AuthorItem authors = 1;
}

message AuthorItem {
  string id = 1;
  string name = 2;
}
