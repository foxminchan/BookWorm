name: BookWorm Documentation
run-name: Docs Build - ${{ github.actor }} (${{ github.ref_name }})

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - .github/workflows/scripts/generate-tunit-manifest.sh
      - .github/workflows/scripts/generate-unified-allure-report.sh
      - docs/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - .github/workflows/scripts/generate-tunit-manifest.sh
      - .github/workflows/scripts/generate-unified-allure-report.sh
      - docs/**
  workflow_run:
    workflows:
      - BookWorm CI (Frontend)
      - SonarQube Analysis
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref || github.run_id) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION_FILE: .bun-version

jobs:
  build:
    name: 📚 Build Documentation
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📄 Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: docs

      - name: 🔑 Configure EventCatalog license
        env:
          EVENTCATALOG_LICENSE: ${{ secrets.EVENTCATALOG_LICENSE }}
        run: |
          if [ -n "$EVENTCATALOG_LICENSE" ]; then
            printf '%s' "$EVENTCATALOG_LICENSE" > docs/license.jwt
          fi

      - name: 🧹 Lint and format check
        run: bun run check
        working-directory: docs

      - name: 🛡️ Run architecture fitness checks
        run: bun run fitness
        working-directory: docs

      - name: ⬆️ Upload fitness report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eventcatalog-fitness-report
          path: docs/.eventcatalog/fitness/results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 🔨 Build documentation
        run: bun run build
        working-directory: docs

      - name: ⬇️ Download Allure Results (Backend Unit)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-results-be-unit
          path: allure-results-all/be-unit/allure-results
          workflow: sonar.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Results (Backend Contract)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-results-be-contract
          path: allure-results-all/be-contract/allure-results
          workflow: sonar.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Results (Backoffice)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-results-fe-bo
          path: allure-results-all/fe-bo/allure-results
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Results (Storefront)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-results-fe-sf
          path: allure-results-all/fe-sf/allure-results
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 💾 Cache Clients Bun dependencies
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('src/Clients/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install Clients dependencies (for Allure CLI)
        if: github.event_name != 'pull_request'
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: src/Clients

      - name: 📊 Generate Unified Allure Report
        if: github.event_name != 'pull_request'
        working-directory: src/Clients
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/generate-unified-allure-report.sh"

      - name: ⬇️ Download Allure Report (Backend)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-report-backend
          path: docs/dist/reports/backend
          workflow: sonar.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Report (Backoffice)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-report-backoffice
          path: docs/dist/reports/backoffice
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Report (Storefront)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: allure-report-storefront
          path: docs/dist/reports/storefront
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download TUnit HTML Reports (Backend)
        if: github.event_name != 'pull_request'
        uses: dawidd6/action-download-artifact@v28
        with:
          name: tunit-report-backend
          path: docs/dist/reports/tunit
          workflow: sonar.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: 📝 Generate TUnit Reports Manifest
        if: github.event_name != 'pull_request'
        run: bash .github/workflows/scripts/generate-tunit-manifest.sh

      - name: ⬆️ Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist

  deploy:
    name: 🚀 Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
