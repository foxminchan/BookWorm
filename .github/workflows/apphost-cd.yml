name: BookWorm AppHost CD
run-name: AppHost CD - ${{ github.event_name }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Aspire environment (Development, Staging, or Production)
        required: true
        type: environment

env:
  GLOBAL_JSON_PATH: global.json
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: bookworm-aspire-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apphost_deploy:
    runs-on: ubuntu-26.04
    name: 🚀 Deploy BookWorm frontend and backend to ACA with Aspire
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🔧 Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}

      - name: 🔧 Setup Aspire CLI
        uses: ./.github/actions/setup-aspire-cli

      - name: 🔐 Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ✅ Validate environment configuration
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          KC_URL: ${{ secrets.KC_URL }}
          KC_REALM: ${{ secrets.KC_REALM }}
          CATALOG_SECRET: ${{ secrets.CATALOG_SECRET }}
          MCPTOOLS_SECRET: ${{ secrets.MCPTOOLS_SECRET }}
          BASKET_SECRET: ${{ secrets.BASKET_SECRET }}
          ORDERING_SECRET: ${{ secrets.ORDERING_SECRET }}
          CHATTING_SECRET: ${{ secrets.CHATTING_SECRET }}
          RATING_SECRET: ${{ secrets.RATING_SECRET }}
          EMAIL_SMTP_ENDPOINT: ${{ vars.EMAIL_SMTP_ENDPOINT }}
          EMAIL_SMTP_USERNAME: ${{ vars.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SENDER_ADDRESS: ${{ vars.EMAIL_SENDER_ADDRESS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo "AZURE_RESOURCE_GROUP is required for this GitHub Environment."; exit 1; }
          missing=()
          for name in KC_URL KC_REALM CATALOG_SECRET MCPTOOLS_SECRET BASKET_SECRET ORDERING_SECRET CHATTING_SECRET RATING_SECRET EMAIL_SMTP_ENDPOINT EMAIL_SMTP_USERNAME EMAIL_SMTP_PASSWORD EMAIL_SENDER_ADDRESS EMAIL_SENDER_NAME; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Environment variables or secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: 🚀 Deploy with Aspire
        run: |
          aspire deploy \
            --environment ${{ inputs.environment }} \
            --non-interactive
        env:
          DOTNET_GENERATE_ASPNET_CERTIFICATE: false
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
          DOTNET_MULTILEVEL_LOOKUP: 0
          DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION || secrets.AZURE_LOCATION || 'southeastasia' }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Parameters__kc_url: ${{ secrets.KC_URL }}
          Parameters__kc_realm: ${{ secrets.KC_REALM }}
          Parameters__catalog_secret: ${{ secrets.CATALOG_SECRET }}
          Parameters__mcptools_secret: ${{ secrets.MCPTOOLS_SECRET }}
          Parameters__basket_secret: ${{ secrets.BASKET_SECRET }}
          Parameters__ordering_secret: ${{ secrets.ORDERING_SECRET }}
          Parameters__chatting_secret: ${{ secrets.CHATTING_SECRET }}
          Parameters__rating_secret: ${{ secrets.RATING_SECRET }}
          Parameters__email_smtp_endpoint: ${{ vars.EMAIL_SMTP_ENDPOINT }}
          Parameters__email_smtp_username: ${{ vars.EMAIL_SMTP_USERNAME }}
          Parameters__email_smtp_password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          Parameters__email_sender_address: ${{ vars.EMAIL_SENDER_ADDRESS }}
          Parameters__email_sender_name: ${{ vars.EMAIL_SENDER_NAME }}
