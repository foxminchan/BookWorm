name: OpenSSF Scorecard
run-name: OpenSSF Scorecard - ${{ github.event_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
  schedule:
    # Runs every Thursday at 10:00 AM Asia/Ho_Chi_Minh (UTC+7)
    - cron: 0 3 * * 4
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: 🛡️ Scorecard Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🛡️ Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: ⬆️ Upload SARIF artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: ⬆️ Upload Scorecard results to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
