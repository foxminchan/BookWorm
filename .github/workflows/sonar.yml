name: SonarQube Analysis
run-name: SonarQube Analysis - ${{ github.actor }} (${{ github.ref_name }})

on:
  push:
    branches:
      - main
    paths:
      # Source & test code
      - src/**
      - tests/**
      # CI/CD configuration
      - .github/actions/**
      - .github/workflows/**
      # Build configuration
      - .config/dotnet-tools.json
      - BookWorm.slnx
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Versions.props
      # SonarQube configuration
      - .sonarlint/**
      - SonarQube.Analysis.xml
      # Exclusions (last-match-wins, must follow includes)
      - "!src/Aspire/BookWorm.AppHost/Container/**"
  pull_request:
    paths:
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/**
      # Build configuration
      - .config/dotnet-tools.json
      - BookWorm.slnx
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Versions.props
      # SonarQube configuration
      - .sonarlint/**
      - SonarQube.Analysis.xml
      - "!**.md"
      - "!src/Aspire/BookWorm.AppHost/Container/**"
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

env:
  JAVA_VERSION: "25"
  GLOBAL_JSON_PATH: global.json
  BUN_VERSION_FILE: .bun-version
  HANG_TIMEOUT: 7m
  SESSION_TIMEOUT: 15m

jobs:
  frontend-test:
    name: 🧪 Frontend tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🎨 Setup Frontend
        uses: $/.github/actions/frontend-setup
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: 🧪 Frontend test with coverage
        working-directory: src/Clients
        run: ./node_modules/.bin/turbo run test:coverage

      - name: ⬆️ Upload frontend coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: |
            src/Clients/apps/storefront/coverage/lcov.info
            src/Clients/apps/backoffice/coverage/lcov.info
          retention-days: 1
          if-no-files-found: warn

  analyze:
    name: 🔍 Build and analyze
    needs:
      - frontend-test
    if: ${{ !cancelled() && needs.frontend-test.result != 'failure' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🔧 Setup .NET Core
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}

      - name: 💾 Cache NuGet Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: |
            ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: ⬇️ Download frontend coverage
        if: needs.frontend-test.result == 'success'
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-coverage
          path: ${{ github.workspace }}/src/Clients/apps

      - name: 🔍 Setup SonarQube Scanner
        uses: $/.github/actions/sonar-scanner-setup

      - name: 🔍 Sonarqube Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          .sonar/scanner/dotnet-sonarscanner begin
          /k:"foxminchan_BookWorm"
          /o:"foxminchan"
          /d:sonar.token="$SONAR_TOKEN"
          /s:$GITHUB_WORKSPACE/SonarQube.Analysis.xml

      - name: 🔨 Build
        run: >
          dotnet build
          --configuration Release
          --no-incremental
          -p:SkipK6Build=true -p:SkipKeycloakifyBuild=true

      - name: 🧪 Test
        env:
          TEST_HANG_TIMEOUT: ${{ env.HANG_TIMEOUT }}
          TEST_SESSION_TIMEOUT: ${{ env.SESSION_TIMEOUT }}
          NO_BUILD: "true"
        run: bash .github/actions/test/scripts/run-tests.sh

      - name: 🔍 Sonarqube End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          .sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
