name: Trivy Security Scan
run-name: Trivy Security Scan - ${{ github.event_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan to catch newly disclosed vulnerabilities in existing dependencies
    # Runs every Monday at 10:00 AM Asia/Ho_Chi_Minh (UTC+7)
    - cron: 0 3 * * 1
  workflow_dispatch:
    inputs:
      severity:
        description: >-
          Comma-separated severity levels to report (e.g.,
          CRITICAL,HIGH,MEDIUM,LOW)
        required: false
        default: "CRITICAL,HIGH,MEDIUM"
permissions: {}

concurrency:
  group: |
    ${{ github.workflow }}-${{ github.event.action || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    name: 🛡️ Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🛡️ Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs-results.sarif
          severity: ${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM' }}

      - name: ⬆️ Upload vulnerability scan results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-vulnerability-scan
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

  misconfig-scan:
    name: 🛡️ Misconfiguration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🛡️ Run Trivy misconfiguration scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          format: sarif
          output: trivy-config-results.sarif
          severity: ${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM' }}

      - name: ⬆️ Upload misconfiguration scan results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-misconfig-scan
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

  sbom:
    name: 📝 SBOM Generation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 📝 Generate CycloneDX SBOM for attestation
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: 📤 Submit dependency snapshot to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: github
          output: dependency-results.sbom.json
          github-pat: ${{ github.token }}

      - name: 📝 Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom.cyclonedx.json

      - name: ⬆️ Upload CycloneDX SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 7
