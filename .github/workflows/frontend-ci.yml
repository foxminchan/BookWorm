name: BookWorm CI (Frontend)
run-name: Frontend CI - ${{ github.event_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/frontend-ci.yml
      - .github/workflows/frontend-shared.yml
      - src/Clients/**
      - "!**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: environment
      publish:
        description: Whether to build and push Docker images
        type: boolean
        required: true
        default: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🎨 Frontend CI Pipeline
    uses: ./.github/workflows/frontend-shared.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  publish:
    name: 🐳 Docker Build, Push & Attest
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish ==
      'true'
    needs:
      - ci
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - app: storefront
            package: "@bookworm/storefront"
            image: bookworm/storefront
          - app: backoffice
            package: "@bookworm/backoffice"
            image: bookworm/backoffice

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push ${{ matrix.app }}
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/Clients
          file: src/Clients/apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            TURBO_TEAM=${{ env.TURBO_TEAM }}
          secrets: |
            TURBO_TOKEN=${{ env.TURBO_TOKEN }}

      - name: 📝 Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: 📣 Trigger container security scan
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.1.0
        with:
          event-type: frontend-container-images-published
