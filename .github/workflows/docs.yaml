name: BookWorm Documentation
run-name: Docs Build - ${{ github.actor }} (${{ github.ref_name }})

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yaml
      - docs/docusaurus/**
  workflow_run:
    workflows:
      - BookWorm CI (Frontend)
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUN_VERSION_FILE: .bun-version

jobs:
  build:
    name: 📚 Build Documentation
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/docusaurus/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📄 Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: docs/docusaurus

      - name: 🔨 Build documentation
        run: bun run build
        working-directory: docs/docusaurus

      - name: ⬇️ Download Allure Report (Backoffice)
        uses: dawidd6/action-download-artifact@v27
        with:
          name: allure-report-backoffice
          path: docs/docusaurus/build/reports/backoffice
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬇️ Download Allure Report (Storefront)
        uses: dawidd6/action-download-artifact@v27
        with:
          name: allure-report-storefront
          path: docs/docusaurus/build/reports/storefront
          workflow: frontend-ci.yml
          workflow_search: true
          branch: main
          event: push
          search_artifacts: true
          if_no_artifact_found: warn

      - name: ⬆️ Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/docusaurus/build

  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
