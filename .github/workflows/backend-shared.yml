name: Backend Shared CI Pipeline
run-name: Backend Shared CI

on:
  workflow_call:
    inputs:
      run-build-and-test:
        description: >-
          Run standalone build and test jobs when they are not delegated to
          SonarQube (for example, on manual dispatch).
        type: boolean
        default: true

permissions: {}

env:
  GLOBAL_JSON_PATH: global.json
  BUN_VERSION_FILE: .bun-version
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  format:
    name: 💅 Format
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 💅 Format
        uses: $/.github/actions/format
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

  style:
    name: 💅 Style
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 💅 Style
        uses: $/.github/actions/style
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

  analyzers:
    name: 🔎 Analyzers
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 🧪 Analyzers
        uses: $/.github/actions/analyzers
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

  build:
    name: 🔨 Build
    if: inputs.run-build-and-test
    runs-on: ubuntu-26.04
    needs:
      - format
      - style
      - analyzers
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 🔨 Build
        uses: $/.github/actions/build
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

  test:
    name: 🧪 Test
    if: inputs.run-build-and-test
    runs-on: ubuntu-26.04
    needs:
      - format
      - style
      - analyzers
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 🧪 Test
        uses: $/.github/actions/test
        with:
          global-json-file: ${{ env.GLOBAL_JSON_PATH }}
          bun-version-file: ${{ env.BUN_VERSION_FILE }}
