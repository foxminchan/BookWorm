name: BookWorm CI (Backend)
run-name: Backend CI - ${{ github.event_name }} by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - .github/actions/**
      - .github/workflows/backend-ci.yml
      - .github/workflows/backend-shared.yml
      - .config/dotnet-tools.json
      - BookWorm.slnx
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - Versions.props
      - "!**.md"
      - "!src/Aspire/BookWorm.AppHost/Container/**"
      - "!src/Clients/**"
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to deploy to
        required: true
        type: environment

permissions: {}

env:
  GLOBAL_JSON_PATH: global.json
  BUN_VERSION_FILE: .bun-version
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🚀 CI Pipeline
    uses: ./.github/workflows/backend-shared.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write

    # Container image builds and pushes are handled by Azure Container Registry.
