name: Test
description: >-
  Execute the full BookWorm test suite (unit, contract, integration) in Release
  configuration with TRX reporting and code coverage collection
author: BookWorm Team
branding:
  icon: check-circle
  color: green

inputs:
  global-json-file:
    description: Path to the global.json file that specifies the .NET SDK version
    required: false
    default: ./global.json
  bun-version-file:
    description: Path to the .bun-version file specifying the Bun runtime version
    required: false
    default: .bun-version
  testSessionTimeout:
    description: >-
      Maximum total duration for the entire test session before forceful
      termination (e.g., '15m', '30m')
    required: false
    default: "15m"
  no-build:
    description: >-
      Skip building before testing (requires pre-built artifacts in
      artifacts/bin/)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache NuGet Packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: |
          ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup Environment
      uses: $/.github/actions/setup
      with:
        global-json-file: ${{ inputs.global-json-file }}
        bun-version-file: ${{ inputs.bun-version-file }}

    - name: Restore dependencies
      shell: bash
      run: dotnet restore BookWorm.slnx

    - name: Expose GitHub Actions Runtime
      uses: actions/github-script@v9.0.0
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

    - name: Test
      shell: bash
      if: success()
      env:
        TEST_SESSION_TIMEOUT: ${{ inputs.testSessionTimeout }}
        NO_BUILD: ${{ inputs.no-build }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/run-tests.sh"
